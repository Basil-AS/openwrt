name: Build IPQ807x NSS WiFi

on: workflow_dispatch

jobs:
    build:
        name: Prepare and build IPQ807x NSS generic images
        runs-on: ubuntu-26.04
        timeout-minutes: 350

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Install build dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y \
                  bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync \
                  zstd unzip python3

            - name: Extract LLVM prebuilt
              run: |
                wget https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq807x/llvm-bpf-22.1.3.Linux-x86_64.tar.zst
                tar --zstd -xvf llvm-bpf-22.1.3.Linux-x86_64.tar.zst

            - name: Update and install feeds
              run: |
                ./scripts/feeds update -a
                ./scripts/feeds install -a

            - name: Import full config for IPQ807x NSS Generic
              run: |
                mv .full_config .config

            - name: QoL fixes on default config
              run: |
                mkdir -p files/etc/uci-defaults
                cat > files/etc/uci-defaults/zzz_99-qol_fixes << EOF
                uci set wireless.radio0.country='US'
                uci set wireless.radio1.country='US'
                uci set wireless.radio2.country='US'
                uci set wireless.radio1.disabled=0
                uci set wireless.radio2.disabled=0
                uci set pbuf.opt.memory_profile=auto
                uci set firewall.@defaults[0].flow_offloading=0
                uci set ecm.@general[0].enable_bridge_filtering=0
                uci set system.@system[0].cronloglevel='7'
                uci commit wireless
                uci commit pbuf
                uci commit firewall
                uci commit ecm
                uci commit system
                EOF

            - name: Download package sources
              run: make download V=s

            - name: Build tools
              run: |
                make tools/install -j$(nproc) V=s || \
                make tools/install V=s

            - name: Build toolchain
              run: |
                make toolchain/install -j$(nproc) V=s || \
                make toolchain/install V=s

            - name: Build target images
              run: |
                make -j$(nproc) V=s || \
                make -j1 V=s

            - name: Collect xiaomi_ax3600 + amneziawg artifacts
              if: always()
              run: |
                mkdir -p out/images out/packages
                cp -v bin/targets/qualcommax/ipq807x/*xiaomi_ax3600* out/images/ 2>/dev/null || true
                cp -v bin/targets/qualcommax/ipq807x/*.manifest out/images/ 2>/dev/null || true
                find bin/packages/aarch64_cortex-a53 -iname '*amneziawg*.apk' -exec cp -v {} out/packages/ \;
                find bin/targets/qualcommax/ipq807x/packages -iname '*amneziawg*.apk' -exec cp -v {} out/packages/ \; 2>/dev/null || true
                ( cd out && find . -type f -exec sha256sum {} \; > SHA256SUMS.txt )
                cat out/SHA256SUMS.txt

            - name: Upload xiaomi_ax3600 image + amneziawg packages
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: xiaomi_ax3600-amneziawg
                if-no-files-found: warn
                path: out/**

            - name: Upload build config used (for reproducibility)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: build-config
                if-no-files-found: warn
                path: .config
