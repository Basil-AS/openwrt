name: Build IPQ807x NSS WiFi

on: workflow_dispatch

jobs:
    build:
        name: Prepare and build IPQ807x NSS generic images
        runs-on: ubuntu-26.04
        timeout-minutes: 150

        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.2

            - name: Install build dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y \
                  bzip2 g++ gawk gcc git glibc-source libncurses-dev make rsync \
                  zstd unzip python3

            - name: Update and install feeds
              run: |
                ./scripts/feeds update -a
                ./scripts/feeds install -a

            - name: Import full config for IPQ807x NSS Generic
              run: |
                mv .full_config .config

            - name: Build tools
              run: |
                make tools/install -j$(nproc) V=s || \
                make tools/install V=s

            - name: Build toolchain
              run: |
                make toolchain/install -j$(nproc) V=s || \
                make toolchain/install V=s

            - name: Build ONLY kmod-amneziawg / amneziawg-tools / luci-proto-amneziawg
              # Targeted package compile, not a full image/multi-device rebuild -
              # the base xiaomi_ax3600 image is already published by AgustinLorenzo
              # (verified sha256 in PROGRESS.md). We only need these 3 packages
              # built against the same kernel tree, not a redundant full image.
              run: |
                make package/feeds/awg/kmod-amneziawg/compile \
                     package/feeds/awg/amneziawg-tools/compile \
                     package/feeds/awg/luci-proto-amneziawg/compile \
                     -j"$(nproc)" V=s || \
                make package/feeds/awg/kmod-amneziawg/compile \
                     package/feeds/awg/amneziawg-tools/compile \
                     package/feeds/awg/luci-proto-amneziawg/compile \
                     -j1 V=s

            - name: Collect amneziawg artifacts
              if: always()
              run: |
                mkdir -p out
                find bin/packages/aarch64_cortex-a53 -iname '*amneziawg*.apk' -exec cp -v {} out/ \; 2>/dev/null || true
                find bin/targets/qualcommax/ipq807x/packages -iname '*amneziawg*.apk' -exec cp -v {} out/ \; 2>/dev/null || true
                ( cd out && find . -type f -exec sha256sum {} \; > SHA256SUMS.txt )
                cat out/SHA256SUMS.txt

            - name: Upload amneziawg packages
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: amneziawg-packages
                if-no-files-found: error
                path: out/**

            - name: Upload build config used (for reproducibility)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: build-config
                if-no-files-found: warn
                path: .config
